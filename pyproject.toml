[project]
name = "mp2-barcelona"
version = "0.1.0"
description = "Miniproyecto 2: modelo de tasación explicable para Banc Avellaner (desarrollo guiado por especificación)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["criterio(id): criterio de aceptación que verifica el test (p. ej. CA3 o CM1)"]
